# ===========================================================================
# Phase 9A - third-cohort feasibility, selection and reservation.
#
# PURPOSE.  Audit candidate PUBLIC cohorts for use as a genuinely untouched
# THIRD cohort, reserved for ONE-SHOT external validation.
#
# HARD RULES, enforced by tests/test_phase9a.py and by
# docs/PHASE9_EXTERNAL_RESERVATION_PROTOCOL.md:
#   * Phase 9A trains NO model and computes NO ADC/SCC classification metric.
#   * No candidate cohort is used to choose features, preprocessing, filters,
#     harmonisation, architecture or any modelling decision.
#   * No candidate is preferred because its imaging looks favourable.
#   * No automated tumour segmentation is implemented, downloaded or run.
#   * No Phase-1..8B artefact is modified.  Dataset/ and Vuong5ROI/ read-only.
#   * Phase 9B is NOT authorised by this config and no code for it exists.
#
# Every scientific parameter lives in this file.  Nothing scientific is
# hard-coded in src/phase9a_audit.py.
# ===========================================================================

experiment:
  name: phase9a_third_cohort_feasibility
  phase: 9A
  authorised_scope: [collection_metadata, segmentation_availability,
                     independence_audit, provenance, feasibility_table,
                     pilot_technical_qa]
  forbidden_scope: [classification_metrics, model_training, model_selection,
                    feature_extraction_on_candidates, feature_selection,
                    combat, harmonisation, automated_segmentation,
                    phase8c, phase9b]

# Evidence-based per-candidate assessment (segmentation codes, provenance,
# independence, feasibility).  Kept in its own file for readability; it is
# configuration, not code.
assessment_config: config/phase9a_assessment.yaml

protocol:
  path: docs/PHASE9_EXTERNAL_RESERVATION_PROTOCOL.md
  # Frozen and hashed BEFORE any candidate-specific metadata query.
  sha256: "94bd5e552662ba629f3b5eec24fa6cc05834e15fda11b2dc32ff3802eca875f0"

# ---------------------------------------------------------------------------
# SOURCE - official TCIA metadata.  Read-only public API.
# ---------------------------------------------------------------------------
source:
  nbia_api: "https://services.cancerimagingarchive.net/nbia-api/services/v1"
  user_agent: "ADC-SCC-MIL/phase9a"
  download:
    timeout_s: 300
    retries: 3
    retry_sleep_s: 5

# ---------------------------------------------------------------------------
# DEVELOPMENT COHORTS - spent.  Never again an external test (protocol 1.1).
# Audited here ONLY as the reference side of the overlap comparison.
# ---------------------------------------------------------------------------
development_cohorts:
  - key: LUNG1
    tcia_collection: "NSCLC-Radiomics"
    doi: "https://doi.org/10.7937/K9/TCIA.2015.PF0M9REI"
    institution: "MAASTRO Clinic / Maastricht University Medical Centre (NL)"
    eligible_adc: 51
    eligible_scc: 151
    consumed_by: "Phases 1-8B"
  - key: RADIOGENOMICS
    tcia_collection: "NSCLC Radiogenomics"
    doi: "https://doi.org/10.7937/K9/TCIA.2017.7hs46erv"
    institution: "Stanford University School of Medicine + Palo Alto VA (USA)"
    eligible_adc: 112
    eligible_scc: 29
    consumed_by: "Phase 8B (untouched-external status deliberately retired)"

# ---------------------------------------------------------------------------
