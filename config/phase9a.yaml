# ---------------------------------------------------------------------------
# ELIGIBILITY THRESHOLDS - protocol section 2.1.  Frozen before the audit.
# ---------------------------------------------------------------------------
eligibility:
  primary_external_test:
    min_total_adc_scc: 60
    min_minority_class: 20
  secondary_robustness_only_if_below: true

# ---------------------------------------------------------------------------
# SEGMENTATION CODES - protocol section 3.  Assigned from evidence, never
# softened, and never replaced by an automated model in Phase 9A.
# ---------------------------------------------------------------------------
segmentation_codes:
  A: "public collection itself contains usable primary-tumour segmentations"
  B: "an official TCIA Analysis Result provides them"
  C: "the literature segmented them manually; masks not public"
  D: "only bounding boxes / tumour location annotations exist"
  E: "no tumour localisation of any kind"

# DICOM modalities that can carry a reusable 3D primary-tumour segmentation.
segmentation_modalities: ["SEG", "RTSTRUCT"]

# ---------------------------------------------------------------------------
# INDEPENDENCE AUDIT - protocol section 4.  Evidence rank 1 is the strongest.
# ---------------------------------------------------------------------------
independence:
  evidence_ranks:
    1: "disjoint PatientIDs AND disjoint StudyInstanceUIDs from official TCIA metadata"
    2: "disjoint PatientIDs from official TCIA metadata"
    3: "different contributing institution documented by TCIA or the source paper"
    4: "a published statement of non-duplication"
    5: "assumption - never sufficient on its own"
  # A shared institution is an independence DEFECT even when patients are
  # disjoint (protocol section 4.1).
  same_centre_as_development_is_a_defect: true
  development_institutions_to_flag: ["MAASTRO", "Maastricht"]

# ---------------------------------------------------------------------------
# PILOT - protocol section 6.  Only for a candidate already satisfying the
# size rule AND carrying code A or B segmentation.
# ---------------------------------------------------------------------------
pilot:
  enabled: true
  n_patients_min: 3
  n_patients_max: 5
  # Deterministic, label-blind, image-blind.  Recorded BEFORE download.
  selection_rule: "first N PatientIDs in ascending lexical order among subjects carrying both a CT series and a segmentation series"
  checks: [dicom_readable, segmentation_readable, ct_mask_geometry,
           subject_series_mapping]
  forbidden: [disease_radiomics, adc_scc_performance,
              image_statistic_comparison_against_project_cohorts]

# ---------------------------------------------------------------------------
# OUTPUTS
# ---------------------------------------------------------------------------
paths:
  audit_dir: external/phase9_candidate_audit
  candidate_table: reports/phase9a_candidate_table.csv
  run_record: reports/phase9a_run.json
  tests_record: reports/phase9a_tests.json
  report: reports/PHASE9A_REPORT.md
  log: logs/phase9a.log
