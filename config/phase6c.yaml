# Phase 6C - CLAM-inspired instance-level supervision on the FROZEN Phase-6A
# ResNet18 CT embeddings.
#
# ONE scientific variable changes against config/phase6b.yaml: an AUXILIARY
# INSTANCE-LEVEL LOSS is added to the gated-attention MIL model.  The image
# encoder, the representation, the ROI, the patch centres, the cohort, the frozen
# outer split, the bag classifier architecture, the gated-attention module, the
# optimiser, the bag loss, the preprocessing rule, the threshold and the
# evaluation are all copied verbatim from Phase 6B and are NOT re-tuned.
#
# CLAM (Lu et al. 2021) is a REFERENCE IMPLEMENTATION ONLY.  Nothing under
# references/CLAM-master/ is imported, vendored, adapted line-by-line or executed.
# What is borrowed is the CONCEPT: high-attention instances are treated as
# pseudo-positive evidence and low-attention instances as pseudo-negative
# evidence, and a small auxiliary instance classifier is trained on that ranking.
# The pseudo targets are MODEL-GENERATED INSTANCE-CLUSTERING TARGETS.  They are
# NOT histologic patch labels and must never be described as such.
#
# Lu's fixed B = 8 is deliberately NOT copied: our bags range from 8 to 900
# instances, so a fixed top-8 / bottom-8 is invalid for small bags.  See
# instance_supervision.k_rule below.

phase3:
  name: gtv_rim_cnn_clam_style_p6c
  roi: gtv_rim
  # frozen, read-only inputs - identical to Phase 6B
  features_dir: cnn_embeddings/gtv_rim_resnet18
  features_format: cnn_embedding          # <PID>.npz holds `embeddings` [N, 512]
  splits_file: splits/gtv_rim_stratified_5fold.csv
  splits_meta_file: splits/gtv_rim_stratified_5fold_meta.json
  feature_names_file: config/phase6b_feature_names.txt
  cohort_file: cohort/gtv_rim_cohort.csv
  expected_patients: 202
  expected_adc: 51
  expected_scc: 151
  expected_features: 512
  expected_instances: 37464
  expected_extraction_signature: "9825ed13538ee681"   # the frozen GTV+Rim lattice
  expected_encoder:
    architecture: resnet18
    weights_enum: ResNet18_Weights.IMAGENET1K_V1
    state_fingerprint: "b6e132d398763cadd5e66a4e994f5a5eb6cf7bd415eb7e8fae476475f749ffe2"
    head: "fc -> Identity"
    frozen: true
  expected_transform_signature: "7d52e0dac8a4438d"
  expected_image_crop_signature: "49756d388a80414f"
  verify_frozen_inputs: true

inner_cv:
  # the frozen Phase-5 / Phase-6B inner CV, unchanged
  n_splits: 3
  shuffle: true
  base_seed: 3000                       # fold seed = base_seed + outer_fold
  epoch_selection: mean_inner_cv_roc_auc
  # Phase 6C selects (lambda_instance, epoch) JOINTLY from the mean inner-CV
  # ROC-AUC surface.  Ties: smaller lambda_instance first, then lower epoch.
  joint_selection: [lambda_instance, epoch]
  tie_break: [smaller_lambda, lowest_epoch]

preprocessing:
  # the unchanged Phase-5 / Phase-6B near-zero-variance rule and z-scoring.
  # Thresholds must NOT be altered.
  variance:
    absolute_std_threshold: 1.0e-8
    relative_std_threshold: 1.0e-8
    eps: 1.0e-12
  standardize: zscore

model:
  input_dim: 512                # unchanged from Phase 6B
  encoder_hidden: [64, 32]      # UNCHANGED - the Phase-6B bag classifier
  activation: relu
  dropout: 0.2
  attention_hidden: 32          # the same gated-attention module as Phase 6B
  pooling:
    clam_attention_mil: gated_attention
  # the ONLY substantive addition: a small binary linear instance classifier on
  # the SAME 32-D encoded instance representation the attention model uses.
  instance_head:
    type: linear
    input: encoded_instance_32d
    out_features: 1
    loss: bce_with_logits
    pos_weight: null            # top-k / bottom-k are equal in size -> balanced

instance_supervision:
  enabled: true
  source: attention_ranking_current_forward_pass
  # adaptive k, an adaptation to CT bag sizes and NOT a reproduction of CLAM's
  # WSI constant B = 8:
  #     k = min(8, max(1, floor(0.10 * N)))
  #     if 2*k > N:  k = floor(N / 2)          (deterministic reduction)
  k_rule:
    fraction: 0.10
    max_k: 8
    min_k: 1
    require: "2*k <= N"
    fallback: floor_n_over_2
  top_k_target: 1               # pseudo-positive  (high attention)
  bottom_k_target: 0            # pseudo-negative  (low attention)
  disjoint_required: true
  applied_to: training_bags_only          # never an outer-test bag
  # candidate grid.  Lu's 0.3 is NOT frozen; the instance-loss weight is the one
  # Phase-6C hyperparameter and is chosen strictly inside the nested CV.
  lambda_instance_grid: [0.1, 0.3]
  total_loss: "(1 - lambda_instance) * L_bag + lambda_instance * L_instance"

training:
  optimizer: adam
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  max_epochs: 100
  bags_per_batch: 1
  loss: weighted_bce_with_logits          # BAG level only
  pos_weight_source: training_patient_counts
  device: cpu                  # the same device as Phases 5 and 6B
  early_stopping_patience: null

seeds:
  python: 42
  numpy: 42
  torch: 42
  # deliberately INDEPENDENT of lambda_instance (the Phase-5C convention), so the
  # two candidates start from an identical initialisation and differ only in the
  # loss they optimise.
  inner_base_seed: 8000         # inner run = 8000 + 100*fold + 10*inner_fold
  final_base_seed: 9000         # refit     = 9000 + 10*fold
  deterministic_torch: true

evaluation:
  threshold: 0.5
  positive_class: 1
  small_bag_threshold: 20

# ---------------------------------------------------------------------------
# Comparisons.  NOTHING on the baseline side is retrained: the Phase-6B
# out-of-fold predictions are read from disk and verified byte-identical against
# reports/phase6c_pre_snapshot.json.
# ---------------------------------------------------------------------------
comparison:
  new_name: phase6c_clam_style_attention
  expected_paired_patients: 202
  # POST-HOC, performed BEFORE any Phase-6C training and labelled as such.
  # It was not pre-specified in Phase 6B and carries no confirmatory weight.
  post_hoc_phase6b_pooling:
    label: "POST-HOC: Phase-6B CNN Attention MIL vs Phase-6B CNN Mean MIL"
    new_predictions: predictions/phase6b_cnn_attention_oof.csv
    reference_predictions: predictions/phase6b_cnn_mean_oof.csv
    new_label: phase6b_cnn_attention
    reference_label: phase6b_cnn_mean
    seed: 20260941
    output: results/phase6c/phase6b_pooling_bootstrap.json
  # PRIMARY: the only changed variable is the instance-level auxiliary loss.
  primary:
    label: "Phase-6C CLAM-style Attention MIL vs Phase-6B CNN Attention MIL"
    reference_name: phase6b_cnn_attention
    reference_predictions: predictions/phase6b_cnn_attention_oof.csv
    reference_pooled_roc_auc: 0.6146
    reference_pooled_pr_auc: 0.3370
    reference_attention_dir: attention/gtv_rim_resnet18_phase6b
    seed: 20260942
    output: results/phase6c/phase6c_vs_phase6b_bootstrap.json
  bootstrap:
    n_resamples: 5000
    unit: patient          # patients are resampled with replacement; NEVER patches
    ci: 0.95

outputs:
  phase_tag: "6c"
  model_name: clam_attention_mil
  model_names:
    clam_attention_mil: phase6c_clam_style_attention
  results_model_names:
    clam_attention_mil: clam_attention
  models_dir: models
  predictions_dir: predictions
  attention_dir: attention/gtv_rim_resnet18_phase6c
  attention_sources:
    - tag: phase6c_clam
      dir: attention/gtv_rim_resnet18_phase6c
  attention_concentration_plain_csv: true
  results_dir: results/phase6c
  selection_dir: results/phase6c/lambda_epoch_selection
  inner_splits_dir: splits/phase6c_inner_cv
  preprocessing_dir: preprocessing/phase6c
  reports_dir: reports
  run_json: reports/phase6c_run.json
  training_log: logs/phase6c_training.log
